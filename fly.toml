# Demo POLACA en Fly.io. Ver code/docs/deploy-fly.md y code/docs/adr-fly.md.
# El nombre `app` lo confirma `fly launch --no-deploy`; cámbialo si ya está tomado.
app = "polaca-demo"
primary_region = "qro"

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[mounts]]
  source = "polaca_data"
  destination = "/data"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"
